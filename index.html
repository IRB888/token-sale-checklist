<script id="domain">
/* Pure, bounded validation and accounting. Imported text is never treated as HTML. */
globalThis.Domain=(()=>{
 const checks=['official','eligibility','deadline','timing','asset','budget','terms','address','wallet','records'];
 const statuses=['research','applied','allocated','funded','closed'];
 const currencies=['USDC','USDT','EUR','USD'];
 function text(v,max){if(typeof v!=='string'||v.length>max)throw Error('text');return v;}
 function money(v){if(typeof v!=='string'||!/^\d{1,12}(?:\.\d{1,2})?$/.test(v))throw Error('money');const[a,b='']=v.split('.');return Number(a)*100+Number(b.padEnd(2,'0'));}
 function iso(v){if(v==='')return '';if(typeof v!=='string'||!/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z$/.test(v)||!Number.isFinite(Date.parse(v))||new Date(v).toISOString()!==v)throw Error('date');return v;}
 function url(v){text(v,500);if(!v)return '';const u=new URL(v);if(u.protocol!=='https:'||u.username||u.password)throw Error('url');return u.href;}
 function project(v){
  if(!v||typeof v!=='object'||Array.isArray(v))throw Error('project');
  const name=text(v.name,100).trim();if(!name)throw Error('name');
  if(!statuses.includes(v.status)||!currencies.includes(v.currency)||typeof v.archived!=='boolean')throw Error('enum');
  if(!Array.isArray(v.checked)||v.checked.length>10||v.checked.some(x=>!checks.includes(x)))throw Error('checks');
  const result={id:text(v.id,100),name,url:url(v.url),network:text(v.network,60),currency:v.currency,status:v.status,archived:v.archived,notes:text(v.notes,5000),deadline:iso(v.deadline),refundDeadline:iso(v.refundDeadline),updatedAt:iso(v.updatedAt),checked:[...new Set(v.checked)]};
  if(!result.id)throw Error('id');
  for(const key of ['budget','deposited','allocation','refunded']){money(v[key]);result[key]=v[key];}
  if(money(result.refunded)>money(result.deposited))throw Error('refund');
  return result;
 }
 function backup(v){if(!v||v.version!==2||!Array.isArray(v.projects)||v.projects.length>50)throw Error('format');const projects=v.projects.map(project);if(new Set(projects.map(x=>x.id)).size!==projects.length)throw Error('duplicate');return projects;}
 function accounting(p){const deposit=money(p.deposited),allocation=money(p.allocation),refund=money(p.refunded);return {held:deposit-refund,excess:Math.max(0,deposit-refund-allocation),due:Math.max(0,allocation-deposit+refund)};}
 function deadline(value,now){if(!value)return 'none';const delta=Date.parse(value)-now;if(delta<=0)return 'overdue';return delta<=86400000?'soon':'future';}
 function icsEscape(v){return String(v).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');}
 function calendar(p,now=new Date().toISOString()){
  const compact=s=>s.replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//IRB888//Sale Planner 2//EN','CALSCALE:GREGORIAN'];
  for(const [key,title] of [['deadline','Application deadline'],['refundDeadline','Refund deadline']])if(p[key])lines.push('BEGIN:VEVENT','UID:'+icsEscape(p.id+'-'+key)+'@sale-planner','DTSTAMP:'+compact(now),'DTSTART:'+compact(p[key]),'SUMMARY:'+icsEscape(p.name+' — '+title),'DESCRIPTION:'+icsEscape('Check the official terms. '+p.url),'END:VEVENT');
  lines.push('END:VCALENDAR');
  // Fold at 70 UTF-8 bytes, never splitting a Unicode code point.
  return lines.map(line=>{let out='',part='',size=0;for(const c of line){const n=new TextEncoder().encode(c).length;if(size+n>70){out+=part+'\r\n ';part='';size=1;}part+=c;size+=n;}return out+part;}).join('\r\n')+'\r\n';
 }
 function migrate(v,id,now){if(!v||typeof v.project!=='string'||!Array.isArray(v.checked))throw Error('legacy');return project({id,name:v.project.trim().slice(0,100)||'Imported checklist',url:'',network:'Ethereum',currency:'USDC',status:'research',archived:false,notes:'',deadline:'',refundDeadline:'',updatedAt:now,checked:[...new Set(v.checked.filter(x=>checks.includes(x)))],budget:'0',deposited:'0',allocation:'0',refunded:'0'});}
 function summary(projects){
  const totals={};for(const p of projects){if(p.archived)continue;const a=accounting(p),c=p.currency;if(!currencies.includes(c))throw Error('currency');const row=totals[c]||(totals[c]={count:0,budget:0,held:0,excess:0,due:0});row.count++;row.budget+=money(p.budget);for(const k of ['held','excess','due'])row[k]+=a[k];}return totals;
 }
 return {summary,checks,statuses,currencies,money,project,backup,accounting,deadline,calendar,migrate};
})();

</script>

const uid=()=>crypto.randomUUID(), t=k=>words[lang][k];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);projects=D.backup(saved);if(['ru','en'].includes(saved.lang))lang=saved.lang;}else{const old=localStorage.getItem('token-sale-checklist:v1');if(old){projects=[D.migrate(JSON.parse(old),uid(),new Date().toISOString())];$('message').textContent=t('migration');}}}catch(_){corrupt=true;}
selected=projects.find(p=>!p.archived)?.id||null;
function persist(){if(blocked||corrupt)return false;try{localStorage.setItem(KEY,JSON.stringify({version:2,lang,projects}));$('saveStatus').textContent=t('saved');return true;}catch(_){$('message').textContent=t('storage');return false;}}
function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));$('language').textContent=lang==='ru'?'EN':'RU';$('search').placeholder=t('search');$('search').setAttribute('aria-label',t('search'));$('importFile').setAttribute('aria-label',t('loadBackup'));}
function amount(cents,currency){return new Intl.NumberFormat(lang,{minimumFractionDigits:2,maximumFractionDigits:2}).format(cents/100)+' '+currency;}
function stamp(value){return value?new Date(value).toLocaleString(lang,{dateStyle:'medium',timeStyle:'short'}):t('none');}
function renderSummary(){const rows=Object.entries(D.summary(projects));$('portfolio').innerHTML=`<h2>${lang==='ru'?'Сводка активных проектов':'Active project totals'}</h2><p class="note">${lang==='ru'?'Каждая валюта считается отдельно. Превышение и остаток к оплате рассчитываются по каждому проекту, без взаимозачёта.':'Currencies stay separate. Excess and funding gaps are calculated per project without netting.'}</p>${rows.length?`<div class="table-wrap"><table><thead><tr><th>${t('currency')}</th>${['budget','held','excess','due'].map(k=>`<th>${t(k)}</th>`).join('')}</tr></thead><tbody>${rows.map(([c,r])=>`<tr><th>${c} (${r.count})</th>${['budget','held','excess','due'].map(k=>`<td>${amount(r[k],c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<p>${t('empty')}</p>`}`;}
function stats(){renderSummary();const active=projects.filter(p=>!p.archived);$('projectCount').textContent=active.length;$('deadlineCount').textContent=active.reduce((n,p)=>n+[p.deadline,p.refundDeadline].filter(d=>D.deadline(d,Date.now())==='soon').length,0);$('checkCount').textContent=active.reduce((n,p)=>n+p.checked.length,0)+' / '+active.length*10;}
function renderList(){const list=projects.filter(p=>p.archived===(view==='archive')&&p.name.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));
 $('list').innerHTML=list.length?list.map(p=>`<button class="project-button ${selected===p.id?'selected':''}" data-project="${esc(p.id)}"><strong>${esc(p.name)}</strong><small>${t(p.status)} · ${p.currency}</small><small>${p.checked.length} ${t('allChecks')}</small></button>`).join(''):`<p class="empty">${t(projects.length?'noMatch':'empty')}</p>`;
 $('activeTab').setAttribute('aria-pressed',view==='active');$('archiveTab').setAttribute('aria-pressed',view==='archive');}
function render(){translate();stats();renderList();if(!editing)renderDetail();if(corrupt)$('message').textContent=t('corrupt');if(blocked){$('message').textContent=t('conflict');document.querySelectorAll('button,input,select,textarea').forEach(el=>{if(!['exportBackup','search'].includes(el.id))el.disabled=true;});}}
function renderDetail(){const p=projects.find(p=>p.id===selected);if(!p){$('detail').innerHTML=`<div class="panel empty"><h2>${t('select')}</h2><p>${t('notice')}</p></div>`;return;}
 const a=D.accounting(p),now=Date.now();
 $('detail').innerHTML=`<section class="panel"><div class="panel-head"><div><p class="eyebrow">${t(p.status)} · ${esc(p.network||'—')}</p><h2>${esc(p.name)}</h2></div><button id="editProject">${t('details')}</button></div>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${t('open')}</a>`:''}<div class="fields" style="margin-top:20px">${['deadline','refundDeadline'].map(k=>`<div><small>${t(k)}</small><strong>${stamp(p[k])}</strong><small class="${D.deadline(p[k],now)==='overdue'?'dangertext':''}">${t(({soon:'soonLabel',future:'future',overdue:'overdue',none:'none'})[D.deadline(p[k],now)])}</small></div>`).join('')}</div><p class="note">${t('timezone')} ${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}</p><div class="actions" style="margin-top:18px"><button id="calendar">${t('calendar')}</button><button id="archiveProject">${t(p.archived?'restore':'archiveAction')}</button></div>${p.notes?`<p style="white-space:pre-wrap;overflow-wrap:anywhere;margin-top:20px">${esc(p.notes)}</p>`:''}<small style="margin-top:15px">${t('lastSaved')}: ${stamp(p.updatedAt)}</small></section><section class="panel"><div class="panel-head"><h2>${t('funds')}</h2><span class="badge">${p.currency}</span></div><div class="table-wrap"><table><tbody>${['budget','deposited','allocation','refunded'].map(k=>`<tr><th>${t(k)}</th><td>${amount(D.money(p[k]),p.currency)}</td></tr>`).join('')}${['held','excess','due'].map(k=>`<tr><th>${t(k)}</th><td><strong>${amount(a[k],p.currency)}</strong></td></tr>`).join('')}</tbody></table></div><p class="note">${t('accountNote')}</p></section><section class="panel"><div class="panel-head"><h2>${t('checklist')}</h2><span class="badge">${p.checked.length} / 10</span></div><progress max="10" value="${p.checked.length}" aria-label="${t('checklist')}"></progress>${D.checks.map((key,i)=>`<label class="check ${p.checked.includes(key)?'done':''}"><input type="checkbox" data-check="${key}" ${p.checked.includes(key)?'checked':''} ${p.archived||blocked||corrupt?'disabled':''}><span>${checkText[lang][i]}</span></label>`).join('')}</section>`;
 $('editProject').onclick=()=>openEditor(p);$('archiveProject').onclick=()=>{if(blocked||corrupt)return;p.archived=!p.archived;p.updatedAt=new Date().toISOString();persist();selected=null;render();};
 $('calendar').onclick=()=>{if(!p.deadline&&!p.refundDeadline){$('message').textContent=t('noDates');return;}download(D.calendar(p),'sale-deadlines.ics','text/calendar;charset=utf-8');};
 $('detail').querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{if(blocked||corrupt)return;p.checked=el.checked?[...new Set([...p.checked,el.dataset.check])]:p.checked.filter(k=>k!==el.dataset.check);p.updatedAt=new Date().toISOString();persist();stats();renderList();renderDetail();});
}
function localDate(value){if(!value)return '';const date=new Date(value);return new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16);}
function toISO(value){return value?new Date(value).toISOString():'';}
function canLeave(){return !dirty||confirm(t('confirmDiscard'));}
function openEditor(existing){if(blocked||corrupt)return;if(!canLeave())return;if(!existing&&projects.length>=50){$('message').textContent=t('limit');return;}
 const p=existing||{id:uid(),name:'',url:'',network:'Ethereum',currency:'USDC',status:'research',budget:'0',deposited:'0',allocation:'0',refunded:'0',deadline:'',refundDeadline:'',notes:'',checked:[],archived:false};editing=true;dirty=false;
 const field=(key,type='text',max=100)=>`<label class="field ${['url','notes'].includes(key)?'wide':''}">${t(key)}${key==='notes'?`<textarea id="f-${key}" maxlength="5000">${esc(p[key])}</textarea>`:`<input id="f-${key}" type="${type}" value="${esc(type==='datetime-local'?localDate(p[key]):p[key])}" ${type==='text'?`maxlength="${max}"`:''} ${key==='name'?'required':''} ${['budget','deposited','allocation','refunded'].includes(key)?'inputmode="decimal" pattern="[0-9]{1,12}(\\.[0-9]{1,2})?"':''}>`}</label>`;
 $('detail').innerHTML=`<form class="panel" id="editor"><div class="panel-head"><h2>${t('formTitle')}</h2><span class="badge">${existing?t(existing.status):t('new')}</span></div><div class="fields">${field('name')}${field('network','text',60)}${field('url','url',500)}<label class="field">${t('status')}<select id="f-status">${D.statuses.map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${t(s)}</option>`).join('')}</select></label><label class="field">${t('currency')}<select id="f-currency">${D.currencies.map(s=>`<option ${p.currency===s?'selected':''}>${s}</option>`).join('')}</select></label>${['budget','deposited','allocation','refunded'].map(k=>field(k,'text',15)).join('')}<small class="wide">${t('currencyNote')}</small>${field('deadline','datetime-local')}${field('refundDeadline','datetime-local')}<small class="wide">${t('timezone')} ${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}</small>${field('notes')}</div><p class="error" id="formError" role="alert"></p><div class="formfoot"><span id="dirtyStatus" class="muted"></span><div class="actions"><button type="button" id="cancelEditor">${t('cancel')}</button><button class="primary" type="submit">${t('save')}</button></div></div></form>`;
 $('editor').oninput=()=>{dirty=true;$('dirtyStatus').textContent=t('unsaved');};$('cancelEditor').onclick=()=>{if(canLeave()){editing=dirty=false;render();}};
 $('editor').onsubmit=e=>{e.preventDefault();if(blocked||corrupt)return;try{const draft={...p,updatedAt:new Date().toISOString()};for(const key of ['name','network','url','status','currency','budget','deposited','allocation','refunded','notes'])draft[key]=$('f-'+key).value.trim();for(const k of ['deadline','refundDeadline'])draft[k]=toISO($('f-'+k).value);const valid=D.project(draft);const i=projects.findIndex(x=>x.id===p.id);if(i<0)projects.push(valid);else projects[i]=valid;selected=valid.id;view=valid.archived?'archive':'active';editing=dirty=false;persist();render();}catch(_){$('formError').textContent=t('invalid');}};
 $('f-name').focus();
}
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('newProject').onclick=()=>openEditor(null);
$('list').onclick=e=>{const b=e.target.closest('[data-project]');if(!b||!canLeave())return;editing=dirty=false;selected=b.dataset.project;render();};
$('language').onclick=()=>{if(!canLeave())return;editing=dirty=false;lang=lang==='ru'?'en':'ru';persist();render();};
$('search').oninput=e=>{query=e.target.value;renderList();};
for(const [id,value] of [['activeTab','active'],['archiveTab','archive']])$(id).onclick=()=>{if(!canLeave())return;editing=dirty=false;view=value;selected=null;render();};
$('exportBackup').onclick=()=>{if(dirty){$('message').textContent=t('unsaved');return;}download(JSON.stringify({version:2,exportedAt:new Date().toISOString(),lang,projects},null,2),'sale-planner-backup.json','application/json');};
$('importBackup').onclick=()=>{if(blocked)return;if(!canLeave())return;$('importFile').click();};
$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file||blocked)return;try{if(file.size>1048576)throw Error('size');const batch=D.backup(JSON.parse(await file.text()));if(blocked)return;if(projects.length+batch.length>50)throw Error('limit');if(!confirm(t('importPreview')+' ('+batch.length+')'))return;
 // Preserve unreadable originals rather than overwriting them during recovery.
 if(corrupt){const original=localStorage.getItem(KEY);if(original)localStorage.setItem(KEY+':recovery:'+Date.now(),original);corrupt=false;}
 const copies=batch.map(p=>({...p,id:uid(),updatedAt:new Date().toISOString()}));projects.push(...copies);selected=copies[0]?.id||selected;view=copies[0]?.archived?'archive':'active';editing=dirty=false;const stored=persist();if(stored)$('message').textContent=t('imported');render();}catch(_){$('message').textContent=t('importBad');}finally{e.target.value='';}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('storage',e=>{if(e.storageArea===localStorage&&(e.key===KEY||e.key===null)){blocked=true;render();}});
render();setInterval(()=>{stats();if(!editing)renderDetail();},60000);

</script>
</body></html>
